experiment: E6
datasets:
- gmsc
- taiwan
- german
- homecredit
- lendingclub
seeds: 20
partitions:
- scheme: dirichlet
  alpha: 0.5
K:
- 10
max_rows: 60000
eval_frac: 0.2
root_frac: 0.1
client_size: 3000
models:
- xgboost
shap:
  n_repeats: 20
  n_explain: 1000
  n_background: 100
dataset_overrides:
  german:
    partition: {}
  lendingclub:
    partition: {}
attacks:
- name: input_noise
  fracs:
  - 0.2
  params:
  - lam: 20
- name: label_flip
  fracs:
  - 0.2
  params:
  - p: 0.4
- name: zero
  fracs:
  - 0.2
- name: frozen
  fracs:
  - 0.2
- name: scaling
  fracs:
  - 0.2
  params:
  - lam: 10
- name: feature_hiding
  fracs:
  - 0.2
- name: feature_promotion
  fracs:
  - 0.2
- name: mimic
  fracs:
  - 0.2
- name: collusion
  fracs:
  - 0.2
- name: adaptive_psnr
  fracs:
  - 0.2
- name: collusion_jitter
  fracs:
  - 0.2
  params:
  - jitter: 3.0
- name: whitebox
  fracs: &id001
  - 0.2
- name: whitebox_strong
  fracs: *id001
  params:
  - {}
  - claim_n: 1000
- name: alie
  fracs: *id001
- name: minmax
  fracs:
  - 0.2
aggregators:
  fedavg: {}
  median: {}
  trimmed_mean:
    beta: 0.2
  trimmed_mean_0.3:
    rule: trimmed_mean
    beta: 0.3
  geomedian: {}
  krum: {}
  multikrum: {}
  bulyan: {}
  centered_clipping: {}
  foolsgold: {}
  ivw:
    eps: 1.0e-12
  dersimonian_laird: {}
  fltrust_like: {}
  psnr_screen:
    z: 2.0
    cap: 2.0
    floor: n
    n_cap: 1000
    shrink: 0.5
    stage2: geomedian
    n_repeats: 20
    dedup: true
    dup_ratio: 1.0
  psnr_v3:
    rule: psnr_v3
    mass_z: 3.0
    weight: n
    cap: 1.5
    dedup: true
    dup_ratio: 4.0
    combine: trim
    trim_beta: 0.3
    profile_screen: false
    n_cap: 1000
  psnr_v3_unif:
    rule: psnr_v3
    mass_z: 3.0
    weight: unif
    cap: 1.5
    dedup: true
    dup_ratio: 4.0
    combine: trim
    trim_beta: 0.3
    profile_screen: false
    n_cap: 1000
  psnr_v3_fit:
    rule: psnr_v3
    mass_z: 3.0
    weight: fit_ts
    cap: 1.5
    dedup: true
    dup_ratio: 1.0
    combine: trim
    trim_beta: 0.3
    profile_screen: false
    n_cap: 1000
seed_offset: 5000
save_phi_seeds: 1
